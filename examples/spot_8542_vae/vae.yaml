telescope:
    diameter: 100.0
    central_obscuration : 0.0

images:
    n_pixel : 56    
    pix_size : 0.059
    apodization_border : 6    

object1:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.98]
    s_u_joint: 250.0

object2:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.98]
    s_u_joint: 250.0
    
optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1.0    
    lr_obj : 0.00
    lr_modes : 0.1
    lr_prior : 0.1
    loss_type: joint
    filter_loss: wiener
    enforce_positive_object: False

regularization:
     iuwt1:
        variable : object
        lambda : 0.00
        nbands : 5

psf:
    model : vae
    nmax_modes : 200
    shift: True
    jitter : none

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.1
    end_pct : 0.6