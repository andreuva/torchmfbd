telescope:
    diameter: 100.0
    central_obscuration : 0.0

images:
    n_pixel : 64    
    pix_size : 0.059
    apodization_border : 10
    remove_gradient_apodization : True

object1:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    s_u_joint: 250.0

object2:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    s_u_joint: 250.0
    
optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1.0    
    lr_obj : 0.00
    lr_modes : 0.08
    lr_prior : 0.08
    loss_type: marginal
    stop_psd_optimization: 5
    show_object_info: False

regularization:
     iuwt1:
        variable : object
        lambda : 0.00
        nbands : 5

psf:
    model : kl
    nmax_modes : 54
    jitter : none

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.1
    end_pct : 0.6

psd:
    K: 250.0
    v0: 0.1
    p: 2.0