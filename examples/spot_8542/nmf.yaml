telescope:
    diameter: 100.0
    central_obscuration : 0.0

images:
    n_pixel : 64    
    pix_size : 0.059
    apodization_border : 10
    remove_gradient_apodization : True

object1:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]

object2:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]

optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1000
    lr_obj : 0.00
    lr_modes : 0.08
    show_object_info: False
    lr_prior : 0.01
    loss_type: marginal

regularization:
     iuwt1:
        variable : object
        lambda : 0.0
        nbands : 5

psf:
    model : nmf    
    nmax_modes : 150
    filename: '../basis/nmf_8542_n_150_r0_5_30.npz'
    ngrid_modes: 8
    shift: True
    jitter: False


initialization:
    object : contrast
    # modes : cross_spectrum_nnls
    modes_std : 0.0

annealing:
    type: none
    start_pct : 0.1
    end_pct : 0.6

priors:
    K:
        mean: 1000
        sigma: 1.0
    v0:
        mean: 0.1
        sigma: 1.0
    p:
        mean: 2.0
        sigma: 2.0