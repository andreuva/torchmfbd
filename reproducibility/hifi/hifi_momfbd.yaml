telescope:
    diameter: 144.0
    central_obscuration : 40.0

images:
    n_pixel : 96
    pix_size : 0.0462
    apodization_border : 14
    remove_gradient_apodization : True  # Essential for off-limb patches

object1:
    wavelength : 6567.0
    image_filter: scharmer
    cutoff : [0.80, 0.85]
    s_u_joint : 100.0

object2:
    wavelength : 6563.0
    image_filter: scharmer
    cutoff : [0.80, 0.85]
    s_u_joint : 100.0

optimization:
    gpu : -1
    transform : softplus
    softplus_scale : 1.0    
    lr_obj : 0.02
    lr_modes : 0.05
    lr_prior : 0.2
    loss_type: joint

regularization:
     iuwt1:
        variable : object
        lambda : 0.001
        nbands : 5

psf:
    model : kl
    nmax_modes : 90
    jitter : False

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.0
    end_pct : 0.6

priors:
    K:
        mean: 10.0
        sigma: 1.0
    v0:
        mean: 0.1
        sigma: 1.0
    p:
        mean: 2.0
        sigma: 1.0
