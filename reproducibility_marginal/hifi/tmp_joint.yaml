telescope:
    diameter: 144.0
    central_obscuration : 40.0

images:
    n_pixel : 96
    pix_size : 0.02761
    apodization_border : 14

object1:
    wavelength : 4300.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    s_u_joint: 1000.0
    
optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1.0    
    lr_obj : 0.02
    lr_modes : 0.05
    lr_prior : 0.2
    loss_type: joint
    stop_psd_optimization: 5  # Modes larger than

regularization:
     iuwt1:
        variable : object
        lambda : 0.0
        nbands : 5

psf:
    model : kl
    nmax_modes : 90
    jitter : none

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.0
    end_pct : 0.6
