telescope:
    diameter: 100.0
    central_obscuration : 0.0

images:
    n_pixel : 271
    pix_size : 0.059
    apodization_border : 0

object1:
    wavelength : 6302.0
    image_filter: scharmer
    cutoff : [0.85, 0.89]
    s_u_joint: 100.0
    
optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1.0    
    lr_modes : 0.05
    lr_prior : 0.05
    loss_type: marginal
    stop_psd_optimization: 5  # Modes larger than

regularization:
     iuwt1:
        variable : object
        lambda : 0.0
        nbands : 5

psf:
    model : kl
    nmax_modes : 104
    jitter : none
    remove_tt : True

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.1
    end_pct : 0.8

psd:
    K: 100.0
    v0: 0.1
    p: 2.0